# tretu.de → hub + platform API (PM2 "tretu-web", 127.0.0.1:3020). TLS by certbot:
#   sudo certbot --nginx -d tretu.de -d www.tretu.de
# Copy to /etc/nginx/sites-available/, link into sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.

upstream tretu_web {
    server 127.0.0.1:3020;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tretu.de www.tretu.de;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://tretu.de$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tretu.de;

    ssl_certificate     /etc/letsencrypt/live/tretu.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tretu.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://tretu.de$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tretu.de;

    ssl_certificate     /etc/letsencrypt/live/tretu.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tretu.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The game-server dashboard uploads mods and worlds through /api/internal/dashboard/instances/*/files.
    client_max_body_size 4g;

    # The app sets its own security headers (CSP, HSTS, …); nginx only forwards.
    # A location with its own proxy_set_header inherits none from the server block, so each lists them all.
    proxy_http_version 1.1;

    # Large uploads and backup downloads stream straight through instead of being buffered on disk.
    location /api/internal/dashboard/ {
        proxy_pass http://tretu_web;
        proxy_set_header Host              $host;
        # Overwrite (never append) the client address: Better Auth uses it for sessions and rate limits.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://tretu_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Access logs are kept 7 days (see deploy/README.md, logrotate) as stated in the privacy policy.
    access_log /var/log/nginx/tretu.de.access.log;
    error_log  /var/log/nginx/tretu.de.error.log warn;
}
