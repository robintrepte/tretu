# status.tretu.de → Uptime Kuma (PM2 "uptime-kuma", 127.0.0.1:3001). TLS: sudo certbot --nginx -d status.tretu.de
map $http_upgrade $kuma_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name status.tretu.de;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.tretu.de;

    ssl_certificate     /etc/letsencrypt/live/status.tretu.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.tretu.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uptime Kuma's dashboard uses Socket.IO websockets.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $kuma_connection_upgrade;
        proxy_read_timeout 1h;
    }
    access_log /var/log/nginx/status.tretu.de.access.log;
}
