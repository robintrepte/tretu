# stats.tretu.de → Umami (PM2 "umami", 127.0.0.1:3050). TLS: sudo certbot --nginx -d stats.tretu.de
upstream tretu_umami { server 127.0.0.1:3050; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name stats.tretu.de;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.tretu.de;

    ssl_certificate     /etc/letsencrypt/live/stats.tretu.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.tretu.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_http_version 1.1;
    location / {
        proxy_pass http://tretu_umami;
        proxy_set_header Host              $host;
        # Umami derives the country from the address and never stores it.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
    access_log /var/log/nginx/stats.tretu.de.access.log;
}
