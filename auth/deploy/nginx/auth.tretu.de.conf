# auth.tretu.de — Tretu-Konto (identity provider), PM2 process tretu-auth on 127.0.0.1:3021.
# Install: cp deploy/nginx/auth.tretu.de.conf /etc/nginx/sites-available/ && ln -s ../sites-available/auth.tretu.de.conf /etc/nginx/sites-enabled/
#          certbot --nginx -d auth.tretu.de && nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=tretu_auth:10m rate=20r/s;
# Sign-in steps (passwords, codes, provider and Steam callbacks): tighter, in front of the app's own limits.
limit_req_zone $binary_remote_addr zone=tretu_auth_signin:10m rate=2r/s;

map $http_upgrade $tretu_auth_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.tretu.de;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # HTTP/2 via `http2 on;` (nginx 1.25.1+; the `listen … http2` parameter is deprecated there).
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.tretu.de;

    ssl_certificate     /etc/letsencrypt/live/auth.tretu.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.tretu.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Avatars are uploaded through the account page (2 MB limit in the app).
    client_max_body_size 3m;

    # Coarse flood protection; the app rate-limits every auth endpoint itself.
    limit_req zone=tretu_auth burst=60 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) the client IP headers: the app trusts them for rate limits and the audit log.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tretu_auth_connection;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/auth/(sign-in|sign-up|steam|callback|magic-link|two-factor|request-password-reset|reset-password)(/|$) {
        limit_req zone=tretu_auth_signin burst=20 nodelay;
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3021;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
