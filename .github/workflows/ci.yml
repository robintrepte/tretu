# The full check suite of both apps in this repository, the same commands as locally:
#   tretu.de (root):        npm run lint · typecheck · test · test:platform · build · test:e2e · test:deploy
#   auth.tretu.de (auth/):  npm run lint · typecheck · test · build · test:integration · test:e2e
#   both together:          npm run build · npm --prefix auth run build · npm run test:e2e:admin-real
# GitHub Actions must be enabled for the repository (Settings → Actions → General) for this to run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: tretu.de · lint, types, tests, build, e2e, deploy scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          # Core tests (tests/helpers/test-db.ts) expect this database to exist; the platform, e2e and deploy
          # tests create their own (tretu_platform_test, tretu_web_test_e2e, throwaway prefixes).
          POSTGRES_DB: tretu_web_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/tretu_web_test
      TRETU_PLATFORM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/tretu_platform_test
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/tretu_web_test_e2e
      TEST_ADMIN_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      # psql / pg_dump in the deploy script tests
      PGHOST: localhost
      PGUSER: postgres
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:platform
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Tools for the deploy script tests (Postgres 16 client, nginx)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16 nginx
      - run: npm run test:deploy
      - run: deploy/scripts/check-nginx.sh deploy/nginx/*.conf
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  auth:
    name: auth.tretu.de · lint, types, unit, build, integration, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: auth
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Integration tests (tests/integration/env.ts) and the Playwright server (e2e/serve.ts) create and reset these.
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/tretu_auth_test
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/tretu_auth_test_e2e
      TEST_ADMIN_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auth/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: auth-playwright-report
          path: |
            auth/playwright-report
            auth/test-results
          retention-days: 7

  admin-real:
    name: tretu.de + auth.tretu.de · central admin e2e (no mocks)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # tests/e2e-real/serve.ts creates and resets tretu_auth_test_admin_real and tretu_web_test_admin_real.
      TEST_ADMIN_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            auth/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: auth
      - run: npm run build
      - run: npm run build
        working-directory: auth
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:admin-real
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: admin-real-playwright-report
          path: |
            playwright-report-admin-real
            test-results
          retention-days: 7
